# 项目类型预设（js / unreal / unity / 建模 / 操作 …）不在这里：
# 它们在 ~/.dsh/profiles/web/cordis.patch.yml 的 generated 区块，由
# ~/.dsh/bin/gen-project-presets.py 从 ~/.dsh/type-presets.yaml + ~/.dsh/preset-base.yml 生成。
#
# 本文件只保留注册表的默认预设：2026-10-17 用户要求删除
# 全能(omni) / 管理(manager) / 简单(simple) 三个预设，并把 omni 的能力
# 折进类型预设（omni 的插件树已抽到 ~/.dsh/preset-base.yml）。
# 0.2.1 的 legacy settings 导入器把 section 映射到 Loader entry id，
# 且没有 `agent-presets` -> `agent-preset-registry` 这条，故旧默认值丢弃，
# 这里显式设回。
- id: agent-preset-registry
  config:
    default: js
