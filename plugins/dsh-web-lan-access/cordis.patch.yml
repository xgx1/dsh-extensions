# dsh-web-lan-access bundle patch — expose the DSH Web GUI to the LAN.
#
# Overrides the official `webserver` row's default bind host to 0.0.0.0 (all
# interfaces). The dsh-web-app bundle provides the `webStartup` service; the
# `web-runtime` row then samples this machine's LAN IPv4 literals and feeds
# them to the /api trust fence, so requests from LAN devices (phones) pass it.
# A patch replaces the targeted row's whole config, so both keys are restated.
# This is a pure overlay: no official source code is modified.
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080